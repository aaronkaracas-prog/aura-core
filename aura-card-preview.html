<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Aura Picture Card</title><style>
:root{color-scheme:dark}body{margin:0;background:#000;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.ctl button{background:#1c1730;color:#e9e3ff;border:1px solid #3b2f63;border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
#box{width:100%;max-width:420px}/* ══ AURA'S PICTURE CARD (2026-10-09, Aaron) ══════════════════════════════════════════════════
   Whenever a picture is being made, this card sits in the chat: her art, a title, a line, a bar
   and a tip, moving through five stages and ending on "All done!". The art is Aura's own, never
   the picture being made. The bar is paced by time and holds short of the end until the picture
   is really there. The X folds it back to the small butterfly; the picture still comes. */
.gencard{position:relative;max-width:420px;margin:4px 0 16px;padding:16px 16px 14px;border-radius:20px;
  background:linear-gradient(180deg,#120f22,#0b0a14);border:1px solid rgba(167,139,250,.22);
  box-shadow:0 10px 40px rgba(88,28,135,.25)}
.gencard .gch{display:flex;align-items:center;gap:10px;color:#fff;font-weight:600;font-size:1rem}
.gencard .gch img{width:38px;height:38px;border-radius:50%;object-fit:cover;box-shadow:0 0 14px rgba(168,85,247,.55)}
.gencard .gcx{margin-left:auto;background:none;border:0;color:#8b86a3;font-size:1.3rem;line-height:1;cursor:pointer;padding:4px 6px}
.gencard .gca{position:relative;height:150px;margin:6px 0 2px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gencard .gca img.art{max-width:100%;max-height:100%;object-fit:contain;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 55%,transparent 78%);mask-image:radial-gradient(ellipse at center,#000 55%,transparent 78%);
  animation:gcIn .7s ease-out both,gcFloat 3.4s ease-in-out .7s infinite,gcGlow 2.6s ease-in-out infinite}
/* Her art is alive: it drifts, breathes light, a soft shine passes through it, and sparks twinkle. */
.gencard .gca .sw{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(105deg,transparent 40%,rgba(216,180,254,.22) 50%,transparent 60%);background-size:260% 100%;
  animation:gcSweep 3.6s ease-in-out infinite}
.gencard .gca .sp{position:absolute;width:4px;height:4px;border-radius:50%;background:#f5d0fe;pointer-events:none;
  box-shadow:0 0 8px 2px rgba(232,121,249,.8);opacity:0;animation:gcTw 2.4s ease-in-out infinite}
@keyframes gcIn{0%{opacity:0;transform:scale(.96)}100%{opacity:1;transform:scale(1)}}
@keyframes gcGlow{0%,100%{filter:brightness(1) saturate(1)}50%{filter:brightness(1.22) saturate(1.2)}}
@keyframes gcSweep{0%{background-position:160% 0}100%{background-position:-60% 0}}
@keyframes gcTw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.gencard .gca img.mark{width:92px;height:92px;border-radius:50%;object-fit:cover;
  box-shadow:0 0 30px 6px rgba(168,85,247,.55),0 0 70px 18px rgba(236,72,153,.18);animation:gcFloat 3.4s ease-in-out infinite}
.gencard h4{margin:6px 0 4px;text-align:center;color:#f3eefe;font:600 1.45rem/1.2 Georgia,'Times New Roman',serif;letter-spacing:.005em}
.gencard .gcs{margin:0 auto 14px;max-width:300px;text-align:center;color:#c9c3e0;font-size:.95rem;line-height:1.4}
.gencard .gcb{height:7px;border-radius:7px;background:#221d33;overflow:hidden;margin:0 6px 14px}
.gencard .gcb i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,#7c3aed,#a855f7 55%,#ec4899);transition:width .6s ease}
.gencard .gct{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid rgba(167,139,250,.2);
  background:rgba(255,255,255,.02);color:#d6d1ea;font-size:.86rem;line-height:1.4}
.gencard .gct svg{flex:0 0 auto;width:22px;height:22px;color:#c084fc}
.gencard.done .gca img{animation:none}
@keyframes gcFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
</style></head><body>

var GEN_HEART_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-9.2-8.6C1.2 8.2 3 5 6.2 5c2 0 3.2 1.1 3.8 2.2C10.6 6.1 11.8 5 13.8 5 17 5 18.8 8.2 17.2 11.4 15 15.6 12 20 12 20z" transform="translate(2 0)"/></svg>';
var GEN_SPARKS = [[14,22,0],[82,18,.5],[26,78,1.1],[70,72,1.6],[48,12,.8],[90,58,2],[8,52,1.4],[60,88,.3]].map(function(a){
  return '<i class=sp style="left:'+a[0]+'%;top:'+a[1]+'%;animation-delay:'+a[2]+'s"></i>' }).join('');
function genStage(g){
  if(g.done) return { i:5, p:100 };
  var t=(Date.now()-g.t0)/1000, p=95*(1-Math.exp(-t/18));
  return { i: p<18?0 : p<38?1 : p<58?2 : p<76?3 : 4, p:Math.max(4,p) };
}
function genCardHtml(g){
  var st=genStage(g), tx=GEN_TEXT[g.kind][st.i], art=WAIT_ART[st.i];
  return '<div class="gencard'+(g.done?' done':'')+'" data-gen=1>'+
    '<div class=gch><img src="'+AURA_MARK+'" alt="">Aura<button class=gcx data-genx aria-label="Hide">×</button></div>'+
    '<div class=gca>'+(art ? '<img class=art src="'+art+'" alt="">' : '<img class=mark src="'+AURA_MARK+'" alt="">')+
      '<span class=sw></span>'+GEN_SPARKS+'</div>'+
    '<h4>'+esc(tx[0])+'</h4><p class=gcs>'+esc(tx[1])+'</p>'+
    '<div class=gcb><i style="width:'+st.p.toFixed(1)+'%"></i></div>'+
    '<div class=gct>'+(st.i===5?GEN_HEART_SVG:GEN_TIP_SVG)+'<span>Tip: '+esc(tx[2])+'</span></div></div>';
}

var timer,start,cur,kind;
function run(k){kind=k;clearInterval(timer);start=Date.now();cur=-1;var box=document.getElementById('box');
 timer=setInterval(function(){var e=Date.now()-start,gg,st;
  if(e>16000){ if(cur!==5){cur=5;box.innerHTML=genCardHtml({t0:0,kind:kind,done:true})} if(e>19000) run(kind); return }
  gg={t0:Date.now()-e*3,kind:kind}; st=genStage(gg);
  if(st.i!==cur){cur=st.i;box.innerHTML=genCardHtml(gg)} else {var b=box.querySelector('.gcb i'); if(b) b.style.width=st.p.toFixed(1)+'%'}
 },250)}
document.getElementById('d').onclick=function(){run('design')};document.getElementById('k').onclick=function(){run('skin')};run('skin');
</script></body></html>
