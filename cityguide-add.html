<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Add your business \u2014 cityguide.world</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#030712;color:#f1f5f9;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:34rem;margin:0 auto;padding:0 20px 4rem}
header{padding:1rem 0;border-bottom:1px solid rgba(59,130,246,.15);text-align:center}
.logo{font-size:1.2rem;font-weight:800;letter-spacing:-.03em}
.logo b{color:#fbbf24}
h1{font-size:2rem;font-weight:800;letter-spacing:-.03em;margin:2.5rem 0 .5rem;line-height:1.15}
.sub{color:#94a3b8;margin-bottom:2rem}
label{display:block;color:#94a3b8;font-size:.88rem;margin:1.1rem 0 .35rem;font-weight:600}
label span{color:#475569;font-weight:400}
input,textarea{width:100%;background:#0b1220;border:1px solid rgba(59,130,246,.25);border-radius:10px;padding:.8rem 1rem;color:#f1f5f9;font-size:1rem;outline:none;font-family:inherit}
input:focus,textarea:focus{border-color:#38bdf8}
textarea{min-height:5rem;resize:vertical}
button{width:100%;background:#1d4ed8;border:0;border-radius:10px;color:#fff;padding:.9rem;font-size:1rem;font-weight:700;cursor:pointer;margin-top:1.6rem}
button:disabled{opacity:.5;cursor:default}
.msg{padding:1.1rem;border-radius:12px;margin-top:1.5rem;font-size:.95rem}
.ok{background:rgba(22,163,74,.15);border:1px solid rgba(74,222,128,.3);color:#bbf7d0}
.bad{background:rgba(220,38,38,.12);border:1px solid rgba(248,113,113,.3);color:#fecaca}
.msg a{color:#93c5fd;text-decoration:underline}
.fine{color:#475569;font-size:.82rem;margin-top:2rem;line-height:1.6}
</style></head><body>
<header><a href="/" class=logo>cityguide<b>.world</b></a></header>
<div class=wrap><div id=stage></div></div>
<script>
var parts = location.pathname.split('/').filter(Boolean);
var stage = document.getElementById('stage');
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function api(body){return fetch('/_addbiz',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify(body)}).then(function(r){return r.json()})}

if(parts[0]==='confirm'){
  stage.innerHTML='<h1>Confirming\u2026</h1>';
  api({action:'CONFIRM',token:parts[1]||''}).then(function(d){
    if(d&&d.ok){
      stage.innerHTML='<h1>You are listed.</h1><p class=sub>'+esc(d.name||'')+' is on cityguide.world.</p>'+
        '<div class="msg ok">'+esc(d.what_to_say||'')+'</div>'+
        '<p style="margin-top:1.5rem"><a class=lnk href="'+esc(d.door||'#')+'" style="color:#38bdf8">See your page \u2192</a></p>'+
        '<p class=fine>'+esc(d.note||'')+'</p>';
    } else {
      stage.innerHTML='<h1>That link did not work.</h1><div class="msg bad">'+
        esc((d&&d.what_to_say)||(d&&d.error)||'Try adding your business again.')+'</div>'+
        '<p style="margin-top:1.5rem"><a href="/add" style="color:#38bdf8">Add your business \u2192</a></p>';
    }
  });
} else {
  stage.innerHTML =
  '<h1>Add your business</h1>'+
  '<p class=sub>Free. Takes a minute. We send one email to confirm it is you.</p>'+
  '<label>Business name</label><input id=name autocomplete=organization>'+
  '<label>Email</label><input id=email type=email autocomplete=email>'+
  '<label>Address <span>optional</span></label><input id=address autocomplete=street-address>'+
  '<label>Phone <span>optional</span></label><input id=phone type=tel autocomplete=tel>'+
  '<label>What you do <span>optional</span></label><textarea id=about></textarea>'+
  '<button id=go>Add my business</button>'+
  '<p class=fine>We list what you type. Nothing else is remembered about you unless you say so, '+
  'and you can have it removed at any time.</p>';
  document.getElementById('go').onclick=function(){
    var b=this;
    var v={action:'START',
      name:(document.getElementById('name').value||'').trim(),
      email:(document.getElementById('email').value||'').trim(),
      address:(document.getElementById('address').value||'').trim(),
      phone:(document.getElementById('phone').value||'').trim(),
      about:(document.getElementById('about').value||'').trim()};
    if(!v.name||!v.email.match(/.+@.+\..+/)){
      alert('A business name and a working email are all we need.');return;
    }
    b.disabled=true;b.textContent='Sending\u2026';
    api(v).then(function(d){
      if(d&&d.ok){
        stage.innerHTML='<h1>Check your email.</h1><div class="msg ok">'+esc(d.what_to_say||'')+'</div>'+
          (d.confirm_link?'<div class="msg bad">Email did not send'+
            (d.send_error?' \u2014 '+esc(d.send_error):'')+'. Use this link:<br><a href="'+
            esc(d.confirm_link)+'">'+esc(d.confirm_link)+'</a></div>':'')+
          '<p class=fine>The link works for seven days. Nothing is listed until you click it.</p>';
      } else {
        b.disabled=false;b.textContent='Add my business';
        stage.insertAdjacentHTML('beforeend','<div class="msg bad">'+
          esc((d&&d.what_to_say)||(d&&d.error)||'Something went wrong.')+'</div>');
      }
    });
  };
}
</script></body></html>
