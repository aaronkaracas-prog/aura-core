<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>cityguide.world</title>
<meta name=description content="Find anything, anywhere. Every business on the planet.">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#030712;color:#f1f5f9;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
header{text-align:center;padding:1.4rem 0;border-bottom:1px solid rgba(59,130,246,.15);position:sticky;top:0;background:rgba(3,7,18,.9);backdrop-filter:blur(12px);z-index:50}
.logo{font-size:1.6rem;font-weight:800;letter-spacing:-.03em}
.logo b{color:#fbbf24;font-weight:800}
.hero{padding:3.5rem 0 2.5rem;text-align:center;background:radial-gradient(900px 400px at 50% -120px,rgba(37,99,235,.35),transparent 70%)}
.hero h1{font-size:clamp(2rem,7vw,3.4rem);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.hero p{color:#94a3b8;margin-top:.6rem;font-size:1.05rem}
section{padding:2.2rem 0}
section h2{font-size:1.35rem;font-weight:700;letter-spacing:-.02em;margin-bottom:1.1rem;display:flex;align-items:center;gap:.7rem}
section h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(59,130,246,.4),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
.card{background:#0b1220;border:1px solid rgba(59,130,246,.15);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .18s ease,border-color .18s ease}
.card:hover{transform:translateY(-2px);border-color:rgba(56,189,248,.45)}
.card img{width:100%;height:150px;object-fit:cover;display:block;background:#0f172a}
.card .body{padding:.85rem 1rem 1rem;display:flex;flex-direction:column;gap:.35rem;flex:1}
.card h3{font-size:1rem;font-weight:700;line-height:1.3}
.rating{color:#fbbf24;font-size:.85rem;font-weight:600}
.addr{color:#64748b;font-size:.8rem;line-height:1.4}
.qr{margin-top:auto;padding-top:.7rem;display:flex;justify-content:flex-end}
.qr img{width:64px;height:64px;border-radius:8px;background:#fff;padding:4px}
.empty{color:#475569;font-size:.9rem}
footer{border-top:1px solid rgba(59,130,246,.15);padding:2rem 0 3rem;text-align:center;color:#475569;font-size:.85rem}
footer b{color:#94a3b8}
</style></head><body>
<header><div class=logo>cityguide<b>.world</b></div></header>
<div class=wrap>
  <div class=hero><h1 data-city>City</h1><p>Everything worth knowing, right now.</p></div>
  <section><h2>Dining</h2><div class=grid data-section=dining></div></section>
  <section><h2>Nightlife</h2><div class=grid data-section=nightlife></div></section>
  <section><h2>Attractions</h2><div class=grid data-section=attractions></div></section>
  <section><h2>Hotels</h2><div class=grid data-section=hotels></div></section>
  <footer>Every listing carries a QR that opens its business on <b>openforbusiness.world</b>.<br>
  Scan it, share it, or put it in your window \u2014 it is the same code either way.</footer>
</div></body></html>
