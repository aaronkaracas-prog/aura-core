name = "aura-core-v2"
main = "src/index.mjs"
# ══ THE RUNTIME PIN, EIGHTEEN MONTHS BEHIND (2026-07-26) ═══════════════════════════════════════
# compatibility_date is NOT a project date - it pins which version of the Cloudflare Workers runtime
# this code runs against. It sat at 2025-01-01 while the date was 2026-07-26, so eighteen months of
# runtime fixes and corrected defaults were being declined. Cloudflare gates behaviour changes behind
# this date precisely so a bump is deliberate, which also means never bumping is a decision nobody
# made on purpose.
# nodejs_compat v2 semantics activated at 2024-09-23, so that transition is already behind us and is
# not what this bump changes. What it DOES change cannot be fully enumerated from here - which is why
# this goes to the staging twin first. The twin exists for exactly this and has not been used once.
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# ── PRODUCTION (top level = the live worker, deployed with `wrangler deploy`) ──

[[kv_namespaces]]
binding = "AURA_KV"
id = "9c2ba111589e48c6ba5ad1b924ae8809"

[[d1_databases]]
binding = "AURA_MEMORY"
database_name = "aura-memory"
database_id = "5c0a0120-1a34-486a-99df-e73e4d564f7d"

[[vectorize]]
binding = "VECTORIZE"
index_name = "aura-vectors"

[ai]
binding = "AI"

[triggers]
crons = ["*/1 * * * *"]

[[services]]
binding = "AURA_OPS"
service = "aura-ops"

[[services]]
binding = "AURA_HOST"
service = "aura-host"

[[services]]
binding = "AURA_COMMS"
service = "aura-comms"

# ADDED 2026-07-21. aura-core's /chat proxies conversational turns to the Think agent so there is ONE
# brain and one conversation memory instead of two Auras. Without this binding the proxy had to reach
# aura-think by its public workers.dev URL, and Cloudflare refused it with error 1042 - a Worker calling
# another Worker on the same account over the public internet. A service binding keeps the call inside
# Cloudflare: internal, faster, and free. aura-think already had the reverse binding (env.AURA_CORE);
# this completes the pair.
[[services]]
binding = "AURA_THINK"
service = "aura-think"

[[durable_objects.bindings]]
name = "ENTITY_DO"
class_name = "EntityDO"

[[durable_objects.bindings]]
name = "AIS_COLLECTOR"
class_name = "AisCollectorDO"

# ADDED 2026-07-24. The meter's single authoritative writer, one instance per day.
# The egress ledger lived in a KV key written on every provider call - and Cloudflare's own docs are
# explicit that a KV key can be written at most once per second, with anything beyond that erroring
# out. A council round makes 16 provider calls in one turn, so the meter was silently dropping rows
# under exactly the load where the numbers matter.
# Their guidance names this case: "Use Durable Objects when you need a single authoritative point of
# consistency per key, for example a chat room, a stock counter or an exact rate limiter." A meter is
# a stock counter. One DO per DAY rather than one for everything, per their rule against putting all
# data in a single object - a day's writes serialise in one place, and days never contend.
[[durable_objects.bindings]]
name = "LEDGER_DO"
class_name = "LedgerDO"

[[migrations]]
tag = "v1-entitydo"
new_sqlite_classes = ["EntityDO"]

[[migrations]]
tag = "v2-ais-collector"
new_classes = ["AisCollectorDO"]

# SQLite-backed, not the legacy KV backend - the ledger aggregates with SUM() and GROUP BY, which is
# the whole reason it stops being O(rows) to read a day.
[[migrations]]
tag = "v3-ledger-do"
new_sqlite_classes = ["LedgerDO"]

# ══ THE KNOWLEDGE BUCKET (2026-07-26) ═══════════════════════════════════════════════════════════
# Where distilled facts land on their way into AI Search. The instance `aura-feeds` in namespace
# `aura` indexes this bucket under the `feeds/` prefix, so ONE bucket serves every future tracker -
# --prefix scopes an instance to a key prefix, which is why twenty-five trackers do not need
# twenty-five buckets.
# The bucket was created and CONFIRMED present before this binding was written. A binding to a
# resource that does not exist fails the entire deploy - that is not theory, it split source from
# running for ten minutes today when SS_STRIPE was declared before its secret existed.
# NOT bound on the staging twin, deliberately: staging has isolated KV/D1/Vectorize, and pointing it
# at the live knowledge bucket would write test facts into real memory. Code must therefore treat a
# missing binding as normal and skip, the same way _egressDO does with LEDGER_DO.
[[r2_buckets]]
binding = "AURA_KNOWLEDGE"
bucket_name = "aura-knowledge"

# RAW, DELIBERATELY IN ITS OWN BUCKET (2026-07-26). The AI Search instance `aura-feeds` points at
# aura-knowledge. It points at NOTHING here - which is the entire mechanism. Raw payloads were first
# written to a raw/ prefix inside the indexed bucket, trusting the instance's prefix setting to keep
# them out; a measured sync indexed them anyway and they outranked the distilled facts in retrieval.
# Separation by construction beats separation by configuration: there is no flag here to misread.
[[r2_buckets]]
binding = "AURA_KNOWLEDGE_RAW"
bucket_name = "aura-knowledge-raw"

# ══ AI SEARCH, NAMESPACE-LEVEL (2026-07-26) ═══════════════════════════════════════════════════
# Binds the `aura` namespace, so env.AI_SEARCH reaches every instance in it and can create more at
# RUNTIME - which is what makes one-instance-per-tracker a configuration change rather than a deploy.
# This binding replaces the older env.AI.autorag() route.
# Adding it changes no behaviour on its own; nothing calls it until the probe below is proven.
[[ai_search_namespaces]]
binding = "AI_SEARCH"
namespace = "aura"

[[send_email]]
name = "SEND_EMAIL"

# ══ TIER-0 CREDENTIALS OUT OF PLAINTEXT (2026-07-26) ════════════════════════════════════════════
# 49 credentials live in KV as plaintext - the bank, the token that controls every domain and DNS
# record, the registrar, GitHub, Stripe, and the operator token itself. GETKV masks them and SETKV
# now guards them, but both are mitigation sitting ON TOP of plaintext. Secrets Store removes the
# plaintext: the value cannot be read back after creation, only the Worker runtime decrypts it at
# execution, and there is no write path from this Worker at all - so GETKV cannot return it, LISTKV
# cannot find it, and SETKV cannot destroy it, because it stops being a KV key.
#
# The store is `default_secrets_store` and it has existed since 2026-01-08. Beta allows exactly one
# store per account, which is why `wrangler secrets-store store create` fails with
# maximum_stores_exceeded - there was never a second one to make.
#
# STRIPE FIRST, deliberately: real tier-0, has a live check so the move is verifiable, and the
# smallest blast radius today because no revenue flows yet. Cloudflare and Mercury follow once this
# exact path is proven end to end.
#
# NOT bound on the staging twin. Staging has its own isolated KV, so it keeps the KV fallback and a
# self-edit tested there never touches the production payment credential.
# PARKED 2026-07-26. This binding is correct but cannot be declared until the secret exists - a
# Worker referencing a missing Secrets Store secret fails the ENTIRE deploy with code 10182, which
# is how source and running diverged for ten minutes today. `wrangler secrets-store secret create`
# is an open-beta command and its interactive prompt returned "Need to pass in a value" after
# accepting input on Windows, so `stripe` was never created in the store.
# The code side (SECRET_BINDING.stripe = "SS_STRIPE") is already live and completely inert without
# this block: getSecret falls through to KV when the binding is absent. Uncomment ONLY after
# `wrangler secrets-store secret list <store-id> --remote` actually shows `stripe`.
# [[secrets_store_secrets]]
# binding = "SS_STRIPE"
# store_id = "8aaeeb2dddae4cce9659c7c21c8d738d"
# secret_name = "stripe"

[browser]
binding = "BROWSER"

# ── STAGING TWIN (deployed with `wrangler deploy --env staging`) ──
# The standard Cloudflare way: one config, an [env.staging] section that overrides ONLY what differs.
# Isolated data (its own KV/D1/Vectorize), no cron, no email. Everything else inherits.

[env.staging]
name = "aura-core-staging"

[env.staging.vars]
WORKER_ENV = "staging"

[[env.staging.kv_namespaces]]
binding = "AURA_KV"
id = "3f137b80965f45a48df36d90a6e89d2b"

[[env.staging.d1_databases]]
binding = "AURA_MEMORY"
database_name = "aura-memory-staging"
database_id = "dcffa0f0-5aa2-4dab-992b-96ce2b16984b"

[[env.staging.vectorize]]
binding = "VECTORIZE"
index_name = "aura-vectors-staging"

[env.staging.ai]
binding = "AI"

[[env.staging.services]]
binding = "AURA_OPS"
service = "aura-ops"

[[env.staging.services]]
binding = "AURA_HOST"
service = "aura-host"

[[env.staging.services]]
binding = "AURA_COMMS"
service = "aura-comms"

# Staging gets the same binding so a self-edit tested on the twin exercises the real proxy path rather
# than silently falling back to the local brain - otherwise the twin would prove something the live
# worker does not do.
[[env.staging.services]]
binding = "AURA_THINK"
service = "aura-think"

[[env.staging.durable_objects.bindings]]
name = "ENTITY_DO"
class_name = "EntityDO"

[[env.staging.durable_objects.bindings]]
name = "AIS_COLLECTOR"
class_name = "AisCollectorDO"

# The twin gets the ledger too, so a meter change can be proven on staging before it touches the
# live count. Same class, its own isolated instances.
[[env.staging.durable_objects.bindings]]
name = "LEDGER_DO"
class_name = "LedgerDO"

[env.staging.browser]
binding = "BROWSER"
